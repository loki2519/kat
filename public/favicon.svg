  <text x="50" y="78" font-family="'Inter',sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KAT</text>
  <!-- Small tagline dots -->
  <circle cx="32" cy="87" r="1" fill="#2D8CFF"/>
  <circle cx="50" cy="87" r="1" fill="#2D8CFF"/>
  <circle cx="68" cy="87" r="1" fill="#2D8CFF"/>
</svg>
