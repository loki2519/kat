<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" rx="22" fill="#081B33" />
  <!-- Circle -->
  <circle cx="50" cy="34" r="22" fill="none" stroke="#2D8CFF" stroke-width="1.5"/>
  <!-- Crown -->
  <rect x="38" y="13" width="24" height="4" rx="1" fill="#2D8CFF"/>
  <polygon points="38,13 42,6 46,13" fill="#2D8CFF"/>
  <polygon points="46,13 50,4 54,13" fill="#2D8CFF"/>
  <polygon points="54,13 58,6 62,13" fill="#2D8CFF"/>
  <!-- Cat body -->
  <ellipse cx="50" cy="44" rx="13" ry="14" fill="#FFFFFF"/>
  <ellipse cx="50" cy="32" rx="12" ry="11" fill="#FFFFFF"/>
  <!-- Ears -->
  <polygon points="38,24 34,16 44,22" fill="#FFFFFF"/>
  <polygon points="62,22 66,14 56,24" fill="#FFFFFF"/>
  <!-- Eye -->
  <circle cx="55" cy="31" r="2.5" fill="#0B3B82"/>
  <circle cx="56.2" cy="30" r="0.8" fill="#FFFFFF"/>
